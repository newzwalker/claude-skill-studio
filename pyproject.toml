[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-skill-studio"
version = "0.3.0"
description = "Interactive Claude Skill Builder, SKILL.md Spec Linter, Progressive Disclosure Token Profiler, and Trigger Benchmark Suite based on Anthropic's Official Skill Guide."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Newz Walker", email = "srtpp072@gmail.com" }
]
keywords = ["claude", "anthropic", "claude-code", "skills", "agent-skills", "mcp", "linter", "prompt-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
claude-skill-studio = "claude_skill_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
