  </text>

  <!-- Left Card 1: Quick Scaffolder -->
  <g filter="url(#cardShadow)">
    <rect x="42" y="156" width="550" height="156" rx="14" fill="#FFFFFF" stroke="#E5E3DA" stroke-width="1.5"/>
