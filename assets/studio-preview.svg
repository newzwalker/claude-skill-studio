    <text x="636" y="198" fill="#5E5D59" font-family="Inter, system-ui, sans-serif" font-size="11">Passes all 5 spec gates</text>

    <text x="816" y="150" fill="#87867F" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Level 1 · YAML Metadata</text>
    <text x="816" y="180" fill="#141413" font-family="Georgia, serif" font-size="26" font-weight="600">34 tok</text>
    <text x="816" y="198" fill="#5E5D59" font-family="Inter, system-ui, sans-serif" font-size="11">Always in system prompt (≤ 80)</text>

    <text x="996" y="150" fill="#87867F" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Level 2 · SKILL.md Body</text>
    <text x="996" y="180" fill="#141413" font-family="Georgia, serif" font-size="26" font-weight="600">148 tok</text>
    <text x="996" y="198" fill="#5E5D59" font-family="Inter, system-ui, sans-serif" font-size="11">28 lines (Target ≤ 500)</text>

