    <text x="74" y="245" fill="#141413" font-family="Consolas, monospace" font-size="12">mcp-schema-auditor</text>

    <text x="288" y="218" fill="#5E5D59" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Activation Trigger ("Use when...")</text>
