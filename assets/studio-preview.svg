  <g transform="translate(32, 16)" fill="#C96442">
    <path d="M12 2L13.6 8.8L19.8 5.4L15.6 11.1L22 13.5L15.2 14.8L18.4 20.9L12.7 16.5L10.2 22.5L9.1 15.6L3 18.8L7.4 13.2L1.5 10.5L8.4 9.4L5.4 3.2L11 7.6L12 2Z"/>
