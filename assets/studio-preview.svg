    <line x1="616" y1="210" x2="1158" y2="210" stroke="#E5E3DA" stroke-width="1"/>
    <line x1="796" y1="127" x2="796" y2="210" stroke="#E5E3DA" stroke-width="1"/>
    <line x1="976" y1="127" x2="976" y2="210" stroke="#E5E3DA" stroke-width="1"/>

