      <text x="71" y="25" text-anchor="middle" fill="#2E6F40" font-family="Consolas, monospace" font-size="11" font-weight="600">PASS · ANT-SEC-001</text>
      <text x="142" y="26" fill="#141413" font-family="Inter, system-ui, sans-serif" font-size="12.5">Frontmatter passed XML angle-bracket injection check.</text>
    </g>

    <g transform="translate(636, 382)">
      <rect width="502" height="42" rx="9" fill="#FAF9F5" stroke="#E5E3DA"/>
      <rect x="12" y="10" width="124" height="22" rx="5" fill="#EAF3EC"/>
      <text x="74" y="25" text-anchor="middle" fill="#2E6F40" font-family="Consolas, monospace" font-size="11" font-weight="600">PASS · ANT-DESC-002</text>
      <text x="148" y="26" fill="#141413" font-family="Inter, system-ui, sans-serif" font-size="12.5">Description includes explicit "Use when..." trigger.</text>
    </g>

    <g transform="translate(636, 434)">
      <rect width="502" height="36" rx="9" fill="#FAF9F5" stroke="#E5E3DA"/>
      <rect x="12" y="7" width="124" height="22" rx="5" fill="#EAF3EC"/>
      <text x="74" y="22" text-anchor="middle" fill="#2E6F40" font-family="Consolas, monospace" font-size="11" font-weight="600">PASS · ANT-WORK-001</text>
      <text x="148" y="23" fill="#141413" font-family="Inter, system-ui, sans-serif" font-size="12.5">Progressive disclosure Level-2 workflow verified.</text>
