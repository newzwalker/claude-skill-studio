      <rect x="12" y="10" width="124" height="22" rx="5" fill="#EAF3EC"/>
      <text x="74" y="25" text-anchor="middle" fill="#2E6F40" font-family="Consolas, monospace" font-size="11" font-weight="600">PASS · ANT-NAME-002</text>
      <text x="148" y="26" fill="#141413" font-family="Inter, system-ui, sans-serif" font-size="12.5">Valid kebab-case skill identifier: "mcp-schema-auditor".</text>
    </g>

    <g transform="translate(636, 330)">
      <rect width="502" height="42" rx="9" fill="#FAF9F5" stroke="#E5E3DA"/>
