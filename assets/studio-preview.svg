    <text x="532" y="356" text-anchor="middle" fill="#5E5D59" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500">Copy</text>

    <text x="64" y="400" fill="#87867F" font-family="Consolas, monospace" font-size="12.5">---</text>
    <text x="64" y="422" fill="#C96442" font-family="Consolas, monospace" font-size="12.5">name: mcp-schema-auditor</text>
    <text x="64" y="444" fill="#2E6F40" font-family="Consolas, monospace" font-size="12.5">description: "Audit MCP server JSON schemas and</text>
    <text x="64" y="464" fill="#2E6F40" font-family="Consolas, monospace" font-size="12.5">  validate tool contracts. Use when building or</text>
    <text x="64" y="484" fill="#2E6F40" font-family="Consolas, monospace" font-size="12.5">  debugging MCP servers or Claude Code tools."</text>
    <text x="64" y="504" fill="#87867F" font-family="Consolas, monospace" font-size="12.5">---</text>
    <text x="64" y="536" fill="#141413" font-family="Consolas, monospace" font-size="13.5" font-weight="700"># MCP Schema Auditor</text>
    <text x="64" y="564" fill="#5E5D59" font-family="Consolas, monospace" font-size="12.5">## Step-by-Step Workflow</text>
    <text x="64" y="588" fill="#141413" font-family="Consolas, monospace" font-size="12">1. Inspect Tool Schema (`inputSchema` required keys)</text>
    <text x="64" y="610" fill="#141413" font-family="Consolas, monospace" font-size="12">2. Check Boundary Types &amp; Parameter Descriptions</text>
    <text x="64" y="632" fill="#141413" font-family="Consolas, monospace" font-size="12">3. Run `claude-skill-studio lint SKILL.md`</text>
  </g>

